version: 2
updates:
  # Enable version updates for Gradle dependencies in the Android project
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.bumptech.glide:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  # Enable version updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "github/*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "github-actions"
